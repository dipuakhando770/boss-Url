name = "boss-url-shortener"
main = "worker/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Workers Assets (serves the React SPA)
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Cloudflare D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "boss-url-db"
database_id = "boss-url-db-prod"
migrations_dir = "migrations"

[vars]
APP_NAME = "Boss URL Shortener SaaS"
STAGE1_DOMAIN = "https://urlshort.nasirdigitalhub.com"
STAGE2_API_URL = "http://107.174.37.180/api/links/stage1"
ADMIN_PATH = "/nachid/admin"
ENVIRONMENT = "production"
JWT_SECRET = "replace-with-secure-wrangler-secret-in-production"
BOOTSTRAP_SECRET = "replace-with-secure-wrangler-secret-in-production"
